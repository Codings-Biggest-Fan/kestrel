[package]
name = "kestrel-ui"
description = "Kestrel main window (opened on demand, exits on close)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kestrel-core.workspace = true
# Software renderer: no GPU driver DLLs mapped into the process, which keeps RAM low.
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }

[build-dependencies]
slint-build = "1.19"
