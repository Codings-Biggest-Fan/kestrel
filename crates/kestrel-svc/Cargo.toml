[package]
name = "kestrel-svc"
description = "Kestrel background service: EC/WMI access, sensors, scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kestrel-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Rpc",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
] }
