# MSI Vector A16 HX A8WIG / A8WHG (board MS-15MM, AMD).
# Register values confirmed on owner hardware in GhostDeck (GPL-3.0) issues #130, #135, #273, #342:
# shift/fan bytes captured from MSI Center, fan-curve tables found byte-for-byte at 0x72/0x8A,
# tachometers at 0xC8:C9 / 0xCA:CB. No Super Battery register (0xEB stays 00 in every scenario).
id = "VECTOR_A16_HX_A8W"
wmi = "wmi2"
tier = "tested"
firmware = [
  { prefix = "15MMIMS1.1", models = "Vector A16 HX A8WIG / A8WHG" },
]

# G2 default; not separately confirmed on this board.
charge_control_address = 0xd7

[cooler_boost]
address = 0x98
bit = 7

[shift_mode]
address = 0xd2

[shift_mode.modes]
turbo = 0xc4
comfort = 0xc1
eco = 0xc2

[fan_mode]
address = 0xd4

[fan_mode.modes]
auto = 0x0d
silent = 0x1d
advanced = 0x8d

[cpu]
rt_temp_address = 0x68
rt_fan_speed_address = 0x71

[gpu]
rt_temp_address = 0x80
rt_fan_speed_address = 0x89

# Fan duty at 0x71/0x89 does not track load on this board; RPM is the reading to trust.
[fan_rpm]
cpu_address = 0xc8
gpu_address = 0xca
wide = true

[fan_curve]
cpu_temp_base = 0x69
cpu_speed_base = 0x72
gpu_temp_base = 0x81
gpu_speed_base = 0x8a
points = 6
