[workspace]
resolver = "2"
members = ["crates/kestrel-core", "crates/kestrel-svc", "crates/kestrel-tray", "crates/kestrel-ui", "crates/kestrel-updater", "crates/kestrel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Codings-Biggest-Fan/kestrel"
rust-version = "1.80"

[workspace.dependencies]
kestrel-core = { path = "crates/kestrel-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
windows-sys = "0.59"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
